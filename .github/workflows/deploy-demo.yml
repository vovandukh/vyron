name: Deploy demo to GitHub Pages

# Builds the demo version (npm run build:demo — straight into demo mode) and publishes it to a separate
# public repository that GitHub Pages serves.
#
# One-time setup:
#   1. A public repository for the demo (vovandukh/vyron-demo by default; another one — the DEMO_REPO variable
#      in Settings → Secrets and variables → Actions → Variables).
#   2. A fine-grained token with access to that repository only, Contents: Read and write →
#      the DEMO_DEPLOY_TOKEN secret in this repository.
#   3. In the demo repository: Settings → Pages → Deploy from a branch → main / (root).
# Without the secret the workflow fails (in forks it silently skips the deploy).

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/screen/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DEMO_REPO: ${{ vars.DEMO_REPO || 'vovandukh/vyron-demo' }}
      TOKEN: ${{ secrets.DEMO_DEPLOY_TOKEN }}
    steps:
      - name: Check deploy token
        id: tok
        run: |
          if [ -z "$TOKEN" ] && [ "$GITHUB_REPOSITORY" = "vovandukh/vyron" ]; then
            echo "::error::DEMO_DEPLOY_TOKEN is not set — the demo was NOT published (see the setup notes at the top of this file)"; exit 1
          fi
          if [ -z "$TOKEN" ]; then
            echo "::notice::no DEMO_DEPLOY_TOKEN in this fork — demo deploy skipped"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.tok.outputs.skip != '1'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.tok.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build demo
        if: steps.tok.outputs.skip != '1'
        run: |
          npm ci
          npm run build:demo
          npm run build:screen:demo
          if grep -qE '(src|href)="\./assets/' apps/web/dist-demo/index.html; then
            echo "apps/web/dist-demo/index.html references ./assets/ — single-file build is broken"; exit 1
          fi

      - name: Publish to demo repository
        if: steps.tok.outputs.skip != '1'
        run: |
          # The site needs no history: every time one bot commit replaces everything (force-push).
          # So the public demo repository holds nothing but the current build.
          mkdir site && cd site
          git init -q -b main
          cp ../apps/web/dist-demo/index.html index.html
          # Vyron Screen in demo mode and the device pages (the "Printer screens" menu)
          cp ../apps/screen/dist-demo/index.html screen.html
          mkdir -p screens && cp ../apps/screen/demo/*.html screens/
          touch .nojekyll
          printf '# Vyron — demo\n\nAuto-generated demo build of Vyron Web and Vyron Screen (Vue 3, single-file).\nDo not edit: every push to the source repository overwrites this content.\n' > README.md
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "deploy demo from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${DEMO_REPO}.git" HEAD:main
