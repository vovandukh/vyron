# Vyron — the nginx site. Created by install/install.sh; running install.sh again rewrites it.
# Serves only the built pages from the repository root (index.html — Vyron Web, screen.html — Vyron Screen);
# the rest of the repository (.git, code, scripts) isn't exposed. API requests go to Moonraker.

upstream vyron_moonraker {
    server 127.0.0.1:@MOONRAKER_PORT@;
}

map $http_upgrade $vyron_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen @PORT@@DEFAULT@;
    listen [::]:@PORT@@DEFAULT@;
    server_name _;

    root @ROOT@;
    client_max_body_size 1024m;

    # Pages: only *.html files in the root; never cached, so updates are picked up at once
    location ~ ^/[A-Za-z0-9_.-]+\.html$ {
        add_header Cache-Control "no-store";
    }
    location = /screen {
        return 302 /screen.html;
    }
    location / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location /websocket {
        proxy_pass http://vyron_moonraker/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vyron_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://vyron_moonraker$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
        proxy_read_timeout 600;
    }

    # Camera (crowsnest / mjpg-streamer on the standard port)
    location /webcam/ {
        proxy_pass http://127.0.0.1:8080/;
    }
}
