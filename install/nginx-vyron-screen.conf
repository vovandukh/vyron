# Vyron Screen — a local nginx site for the printer screen only. Created by install/screen.sh.
# Listens on 127.0.0.1 only (unreachable from the network), leaves Mainsail and the vyron site alone.

map $http_upgrade $vyron_screen_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:@PORT@;
    server_name _;
    root @ROOT@;

    # Vyron Screen or (install.sh --gpu --screen-app web) the full Vyron Web — both uncached,
    # so a new version is picked up right after an update
    location = /screen.html {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location / {
        return 302 @HOME@;
    }

    location /websocket {
        proxy_pass http://127.0.0.1:@MOONRAKER_PORT@/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vyron_screen_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400;
    }

    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://127.0.0.1:@MOONRAKER_PORT@$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_read_timeout 600;
    }
}
